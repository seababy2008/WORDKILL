<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordKill 背单词</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f4f8;
            padding: 16px;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 20px 16px;
            max-width: 720px;
            margin: 0 auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        h1 { font-size: 20px; color: #1a202c; text-align: center; margin-bottom: 4px; }
        .subtitle { font-size: 12px; color: #a0aec0; text-align: center; margin-bottom: 16px; }

        .progress-bar {
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .progress-fill {
            height: 100%;
            background: #4299e1;
            width: 0%;
            transition: width 0.3s;
        }

        .match-grid {
            display: flex;
            gap: 12px;
        }
        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .col-title {
            font-size: 12px;
            color: #a0aec0;
            text-align: center;
            margin-bottom: 2px;
        }

        .word-btn, .meaning-btn {
            padding: 12px 8px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s;
            color: #2d3748;
            text-align: center;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .word-btn:hover, .meaning-btn:hover { border-color: #90cdf4; background: #ebf8ff; }

        /* 已配对成功的颜色 */
        .word-btn.matched, .meaning-btn.matched {
            border-color: #48bb78;
            background: #f0fff4;
            color: #22543d;
            font-weight: 600;
            cursor: default;
        }
        /* 选中状态 */
        .word-btn.selected, .meaning-btn.selected {
            border-color: #4299e1;
            background: #ebf8ff;
        }
        /* 配对错误闪烁 */
        .word-btn.wrong-flash, .meaning-btn.wrong-flash {
            border-color: #fc8181;
            background: #fff5f5;
            color: #742a2a;
        }
        .word-btn:disabled, .meaning-btn:disabled {
            cursor: default;
        }

        .submit-bar {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .result-text {
            text-align: center;
            font-size: 14px;
            color: #4a5568;
            min-height: 20px;
        }
        .result-text strong { color: #2b6cb0; }
        .next-btn {
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: #48bb78;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>WordKill 背单词</h1>
        <p class="subtitle">给左边的单词，点选右边对应的中文</p>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="match-grid">
            <div class="col" id="wordCol">
                <div class="col-title">单词</div>
            </div>
            <div class="col" id="meaningCol">
                <div class="col-title">中文</div>
            </div>
        </div>

        <div class="submit-bar">
            <div class="result-text" id="resultText"></div>
            <button class="next-btn hidden" id="nextBtn" onclick="generateRound()">再来一组</button>
        </div>
    </div>

    <script>
        // ============ 词库 ============
        const WORD_POOL = [
            { word: "apple", meaning: "苹果" },
            { word: "banana", meaning: "香蕉" },
            { word: "orange", meaning: "橙子" },
            { word: "grape", meaning: "葡萄" },
            { word: "watermelon", meaning: "西瓜" },
            { word: "strawberry", meaning: "草莓" },
            { word: "pineapple", meaning: "菠萝" },
            { word: "mango", meaning: "芒果" },
            { word: "peach", meaning: "桃子" },
            { word: "cherry", meaning: "樱桃" },
            { word: "lemon", meaning: "柠檬" },
            { word: "coconut", meaning: "椰子" },
            { word: "blueberry", meaning: "蓝莓" },
            { word: "raspberry", meaning: "树莓" },
            { word: "kiwi", meaning: "猕猴桃" }
        ];

        const QUESTIONS_PER_ROUND = 10;
        const STORAGE_KEY = "wordkill_progress";

        // ============ 进度管理 ============
        function loadProgress() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch (e) { return {}; }
        }
        function saveProgress(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }
        function getWeight(word, progress) {
            return progress[word] ? progress[word].weight : 1.0;
        }
        function pickWeightedWords(n) {
            const progress = loadProgress();
            const pool = WORD_POOL.map(item => ({
                ...item,
                weight: getWeight(item.word, progress)
            }));
            return pool
                .map(item => ({ ...item, rand: Math.random() / item.weight }))
                .sort((a, b) => b.rand - a.rand)
                .slice(0, Math.min(n, pool.length));
        }

        // ============ 本轮状态 ============
        let currentRound = [];
        let matchedPairs = {};  // { word: meaning }
        let selectedWordBtn = null;
        let selectedWord = null;

        // ============ 生成一轮 ============
        function generateRound() {
            matchedPairs = {};
            selectedWordBtn = null;
            selectedWord = null;
            document.getElementById("resultText").textContent = "";
            document.getElementById("nextBtn").classList.add("hidden");
            updateProgressFill(0);

            currentRound = pickWeightedWords(QUESTIONS_PER_ROUND);

            // 左列：单词（保持原顺序）
            const wordCol = document.getElementById("wordCol");
            wordCol.innerHTML = '<div class="col-title">单词</div>';

            currentRound.forEach(item => {
                const btn = document.createElement("button");
                btn.className = "word-btn";
                btn.textContent = item.word;
                btn.dataset.word = item.word;
                btn.onclick = () => selectWord(btn, item.word);
                wordCol.appendChild(btn);
            });

            // 右列：中文（打乱顺序）
            const shuffledMeanings = [...currentRound].sort(() => Math.random() - 0.5);
            const meaningCol = document.getElementById("meaningCol");
            meaningCol.innerHTML = '<div class="col-title">中文</div>';

            shuffledMeanings.forEach(item => {
                const btn = document.createElement("button");
                btn.className = "meaning-btn";
                btn.textContent = item.meaning;
                btn.dataset.meaning = item.meaning;
                btn.onclick = () => selectMeaning(btn);
                meaningCol.appendChild(btn);
            });
        }

        // ============ 选中单词 ============
        function selectWord(btn, word) {
            if (btn.classList.contains("matched")) return;

            // 取消之前选中
            if (selectedWordBtn) selectedWordBtn.classList.remove("selected");

            selectedWordBtn = btn;
            selectedWord = word;
            btn.classList.add("selected");
        }

        // ============ 选中中文 ============
        function selectMeaning(btn) {
            if (btn.classList.contains("matched")) return;
            if (!selectedWord) {
                // 没选单词就点了中文，忽略
                return;
            }

            const chosenMeaning = btn.dataset.meaning;
            // 查找这个单词的正确释义
            const correctMeaning = currentRound.find(item => item.word === selectedWord).meaning;

            if (chosenMeaning === correctMeaning) {
                // 配对成功
                selectedWordBtn.classList.remove("selected");
                selectedWordBtn.classList.add("matched");
                btn.classList.add("matched");
                matchedPairs[selectedWord] = chosenMeaning;

                selectedWordBtn = null;
                selectedWord = null;

                updateProgressFill(Object.keys(matchedPairs).length / currentRound.length);
                document.getElementById("resultText").textContent =
                    `已配对 ${Object.keys(matchedPairs).length} / ${currentRound.length}`;

                // 全部配对完成
                if (Object.keys(matchedPairs).length === currentRound.length) {
                    finishRound();
                }
            } else {
                // 配对错误：闪一下红色
                btn.classList.add("wrong-flash");
                selectedWordBtn.classList.add("wrong-flash");
                setTimeout(() => {
                    btn.classList.remove("wrong-flash");
                    if (selectedWordBtn) selectedWordBtn.classList.remove("wrong-flash");
                }, 500);
            }
        }

        // ============ 完成一轮 ============
        function finishRound() {
            // 更新权重
            const progress = loadProgress();
            currentRound.forEach(item => {
                const key = item.word;
                const isCorrect = matchedPairs[key] === item.meaning;
                const oldWeight = getWeight(key, progress);
                const newWeight = isCorrect ? oldWeight * 0.8 : oldWeight * 1.2;
                progress[key] = {
                    weight: newWeight,
                    correct: (progress[key]?.correct || 0) + (isCorrect ? 1 : 0),
                    wrong: (progress[key]?.wrong || 0) + (isCorrect ? 0 : 1)
                };
            });
            saveProgress(progress);

            document.getElementById("resultText").innerHTML =
                `本轮完成！答对的词下次出现概率会降低`;
            document.getElementById("nextBtn").classList.remove("hidden");
        }

        // ============ 进度条 ============
        function updateProgressFill(ratio) {
            document.getElementById("progressFill").style.width = `${ratio * 100}%`;
        }

        // ============ 启动 ============
        generateRound();
    </script>
</body>
</html>
