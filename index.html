<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordKill 背单词</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f4f8;
            padding: 16px;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 20px 16px;
            max-width: 720px;
            margin: 0 auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        h1 { font-size: 20px; color: #1a202c; text-align: center; margin-bottom: 4px; }
        .subtitle { font-size: 12px; color: #a0aec0; text-align: center; margin-bottom: 16px; }
        .progress-bar {
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .progress-fill {
            height: 100%;
            background: #4299e1;
            width: 0%;
            transition: width 0.3s;
        }
        .question-list { display: flex; flex-direction: column; gap: 16px; }
        .question-item {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
        }
        .question-header {
            font-size: 18px;
            font-weight: 700;
            color: #2b6cb0;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .question-index {
            font-size: 12px;
            color: #a0aec0;
            font-weight: 400;
        }
        .options { display: flex; flex-wrap: wrap; gap: 8px; }
        .option {
            flex: 1 1 calc(50% - 8px);
            padding: 10px 8px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s;
            color: #2d3748;
        }
        .option:hover { border-color: #90cdf4; background: #ebf8ff; }
        .option.correct { border-color: #48bb78; background: #f0fff4; color: #22543d; font-weight: 600; }
        .option.wrong { border-color: #fc8181; background: #fff5f5; color: #742a2a; }
        .option:disabled { cursor: default; }
        .option:disabled:hover { border-color: #e2e8f0; background: #fff; }
        .option.correct:disabled:hover { border-color: #48bb78; background: #f0fff4; }
        .submit-bar {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .submit-btn {
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #4299e1;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .submit-btn:disabled { background: #a0aec0; cursor: default; }
        .result-text {
            text-align: center;
            font-size: 14px;
            color: #4a5568;
            min-height: 20px;
        }
        .result-text strong { color: #2b6cb0; }
        .next-btn {
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: #48bb78;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>WordKill 背单词</h1>
        <p class="subtitle" id="subtitle">一屏 10 题，选完点提交</p>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="question-list" id="questionList"></div>

        <div class="submit-bar">
            <div class="result-text" id="resultText"></div>
            <button class="submit-btn" id="submitBtn" onclick="submitAll()">提交答案</button>
            <button class="next-btn hidden" id="nextBtn" onclick="generateRound()">再来一组</button>
        </div>
    </div>

    <script>
        // ============ 词库 ============
        const WORD_POOL = [
            { word: "apple", meaning: "苹果" },
            { word: "banana", meaning: "香蕉" },
            { word: "orange", meaning: "橙子" },
            { word: "grape", meaning: "葡萄" },
            { word: "watermelon", meaning: "西瓜" },
            { word: "strawberry", meaning: "草莓" },
            { word: "pineapple", meaning: "菠萝" },
            { word: "mango", meaning: "芒果" },
            { word: "peach", meaning: "桃子" },
            { word: "cherry", meaning: "樱桃" },
            { word: "lemon", meaning: "柠檬" },
            { word: "coconut", meaning: "椰子" },
            { word: "blueberry", meaning: "蓝莓" },
            { word: "raspberry", meaning: "树莓" },
            { word: "kiwi", meaning: "猕猴桃" }
        ];

        const QUESTIONS_PER_ROUND = 10; // 每轮题数，可改
        const STORAGE_KEY = "wordkill_progress";

        // ============ 进度管理 ============
        function loadProgress() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch (e) { return {}; }
        }

        function saveProgress(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function getWeight(word, progress) {
            return progress[word] ? progress[word].weight : 1.0;
        }

        // 加权随机抽 N 个不重复的词
        function pickWeightedWords(n) {
            const progress = loadProgress();
            const pool = WORD_POOL.map(item => ({
                ...item,
                weight: getWeight(item.word, progress)
            }));
            // 按权重加权随机排序
            const sorted = pool
                .map(item => ({ ...item, rand: Math.random() / item.weight }))
                .sort((a, b) => b.rand - a.rand)
                .slice(0, Math.min(n, pool.length));
            return sorted;
        }

        // ============ 本轮状态 ============
        let currentRound = [];   // 本轮题目数据
        let answers = {};        // 用户作答记录 { word: chosenWord }
        let submitted = false;

        // ============ 生成一轮题目 ============
        function generateRound() {
            submitted = false;
            answers = {};
            document.getElementById("submitBtn").disabled = false;
            document.getElementById("submitBtn").classList.remove("hidden");
            document.getElementById("nextBtn").classList.add("hidden");
            document.getElementById("resultText").textContent = "";
            updateProgressFill(0);

            // 抽取本轮单词
            currentRound = pickWeightedWords(QUESTIONS_PER_ROUND);

            const listEl = document.getElementById("questionList");
            listEl.innerHTML = "";

            currentRound.forEach((item, index) => {
                // 生成干扰项
                const others = WORD_POOL.filter(w => w.word !== item.word);
                const shuffled = others.sort(() => Math.random() - 0.5).slice(0, 3);
                const options = [item, ...shuffled].sort(() => Math.random() - 0.5);

                const questionEl = document.createElement("div");
                questionEl.className = "question-item";

                const header = document.createElement("div");
                header.className = "question-header";
                header.innerHTML = `<span>${item.word}</span><span class="question-index">第 ${index + 1} 题</span>`;
                questionEl.appendChild(header);

                const optionsEl = document.createElement("div");
                optionsEl.className = "options";

                options.forEach(opt => {
                    const btn = document.createElement("button");
                    btn.className = "option";
                    btn.textContent = opt.meaning;
                    btn.dataset.word = item.word;
                    btn.dataset.meaning = opt.meaning;
                    btn.onclick = () => handleSelect(btn, item.word, opt.meaning);
                    optionsEl.appendChild(btn);
                });

                questionEl.appendChild(optionsEl);
                listEl.appendChild(questionEl);
            });
        }

        // ============ 选择答案 ============
        function handleSelect(btn, word, meaning) {
            if (submitted) return;

            // 同一题内只能选一个
            const siblings = btn.parentElement.querySelectorAll(".option");
            siblings.forEach(b => {
                b.classList.remove("correct", "wrong");
            });
            btn.classList.add("correct");

            answers[word] = meaning;
            updateProgressFill(Object.keys(answers).length / currentRound.length);
        }

        // ============ 提交批改 ============
        function submitAll() {
            if (submitted) return;
            if (Object.keys(answers).length < currentRound.length) {
                alert(`还有 ${currentRound.length - Object.keys(answers).length} 题没选，请全部作答后再提交`);
                return;
            }

            submitted = true;
            const progress = loadProgress();
            let correctCount = 0;

            currentRound.forEach(item => {
                const key = item.word;
                const isCorrect = answers[key] === item.meaning;
                if (isCorrect) correctCount++;

                const oldWeight = getWeight(key, progress);
                const newWeight = isCorrect ? oldWeight * 0.8 : oldWeight * 1.2;
                progress[key] = {
                    weight: newWeight,
                    correct: (progress[key]?.correct || 0) + (isCorrect ? 1 : 0),
                    wrong: (progress[key]?.wrong || 0) + (isCorrect ? 0 : 1)
                };
            });
            saveProgress(progress);

            // 标记正误
            document.querySelectorAll(".question-item").forEach((qEl, index) => {
                const item = currentRound[index];
                const buttons = qEl.querySelectorAll(".option");
                buttons.forEach(btn => {
                    btn.disabled = true;
                    const isCorrectOption = btn.dataset.meaning === item.meaning;
                    const isChosen = answers[item.word] === btn.dataset.meaning;
                    btn.classList.remove("correct", "wrong");
                    if (isCorrectOption) btn.classList.add("correct");
                    if (isChosen && !isCorrectOption) btn.classList.add("wrong");
                });
            });

            document.getElementById("resultText").innerHTML =
                `本轮答对 <strong>${correctCount} / ${currentRound.length}</strong> 题，答对的词下次出现概率会降低`;
            document.getElementById("submitBtn").classList.add("hidden");
            document.getElementById("nextBtn").classList.remove("hidden");
        }

        // ============ 进度条 ============
        function updateProgressFill(ratio) {
            document.getElementById("progressFill").style.width = `${ratio * 100}%`;
        }

        // ============ 启动 ============
        generateRound();
    </script>
</body>
</html>
